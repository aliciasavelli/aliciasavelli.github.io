<html>

    {% include head.html %}

    <body>

        {% include header.html %}

        <section id="banner" class="style2{% if page.banner_center %} banner-centered{% endif %}"{% if page.banner_overlay %} style="--banner-overlay: {{ page.banner_overlay }};"{% endif %}{% if page.banner_focus %} data-focus="{{ page.banner_focus }}"{% endif %}>
            <div class="inner">
                <span class="image">
                    <img src="{{ site.baseurl }}/{{ page.image }}" alt="">
                </span>
                <header class="major">

                    <h1>{{ page.title }}</h1>

                </header>
                <div class="content">

                    {{ page.banner_text | default: page.description }}

                </div>
            </div>
        </section>

    {{ content }}

    {% include footer.html %}

</body>

</html>
